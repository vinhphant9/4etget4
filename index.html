<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>QR Auto Record</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
  text-align: center;
}
input, button {
  padding: 10px;
  font-size: 16px;
  margin: 5px;
}
video, canvas {
  width: 100%;
  max-width: 420px;
  border: 2px solid #0f0;
}
</style>
</head>

<body>

<h3>🔐 Nhập mật khẩu</h3>
<input id="passwordInput" placeholder="Nhập mật khẩu">
<button onclick="login()">Xác nhận</button>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none"></canvas>
<p id="status">Chưa quét QR</p>

<script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>

<script>
/* ========= MẬT KHẨU ========= */
const USERS = {
  "0": null,
  "2": null,
  "pass003": null,
  "pass004": null,
  "pass005": null
};

function getDeviceId() {
  let id = localStorage.getItem("device_id");
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("device_id", id);
  }
  return id;
}

/* ========= ÂM THANH BÍP ========= */
let audioCtx;
function beep() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.frequency.value = 1000;
  g.gain.value = 0.25;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  setTimeout(() => o.stop(), 120);
}

/* ========= CAMERA ========= */
let mediaStream;
let recorder;
let recordedChunks = [];
let currentQR = "";

async function login() {
  const pass = passwordInput.value.trim();
  if (!(pass in USERS)) {
    alert("Sai mật khẩu");
    return;
  }

  const deviceId = getDeviceId();
  const key = "lock_" + pass;
  const locked = localStorage.getItem(key);

  if (!locked) localStorage.setItem(key, deviceId);
  else if (locked !== deviceId) {
    alert("Mật khẩu đã bị khóa trên máy khác");
    return;
  }

  beep(); // mở audio context

  mediaStream = await navigator.mediaDevices.getUserMedia({
  video: {
    facingMode: { exact: "environment" },
    width: { ideal: 1920 },
    height: { ideal: 1080 },
    frameRate: { ideal: 60 }
  },
  audio: {
    echoCancellation: false,
    noiseSuppression: false,
    sampleRate: 48000
  }
});

  video.srcObject = mediaStream;
  startScan();
}

/* ========= QUAY VIDEO ========= */
function startRecording(qr) {
  const canvasStream = canvas.captureStream(30);
  const audioTrack = mediaStream.getAudioTracks()[0];
  canvasStream.addTrack(audioTrack);

 recorder = new MediaRecorder(canvasStream, {
  mimeType: "video/webm;codecs=vp9,opus",
  videoBitsPerSecond: 20_000_000, // 20 Mbps
  audioBitsPerSecond: 256_000
});

  recordedChunks = [];

  recorder.ondataavailable = e => recordedChunks.push(e.data);

  recorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: "video/webm" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `QR_${qr}_${Date.now()}.webm`;
    a.click();
  };

  recorder.start();
}

/* ========= QUÉT QR ========= */
function startScan() {
  const ctx = canvas.getContext("2d");

  setInterval(() => {
    if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

    const W = 1920;
const H = 1080;

canvas.width = W;
canvas.height = H;

ctx.drawImage(video, 0, 0, W, H);


    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const qr = jsQR(img.data, canvas.width, canvas.height);

    if (qr && qr.data !== currentQR) {
      beep();
      document.getElementById("status").innerText = "📦 QR: " + qr.data;

      if (recorder && recorder.state === "recording") {
        recorder.stop(); // 👉 TỰ LƯU FILE QR CŨ
      }

      currentQR = qr.data;
      startRecording(currentQR);
    }
  }, 400);
}
</script>

</body>
</html>

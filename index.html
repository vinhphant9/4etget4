<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Video Recorder</title>
    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #000; }
        #video { width: 100%; height: auto; }
        #canvas { display: none; }
        #status { color: white; font-size: 18px; margin-top: 10px; }
    </style>
    <!-- Include jsQR library locally for offline use. Download from https://github.com/cozmo/jsQR and save as jsQR.js in the same folder -->
    <script src="jsQR.js"></script>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <div id="status">Đang chờ quét QR...</div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');

        let stream;
        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;
        let lastQRCode = null;
        let currentQRCode = null;
        let beepAudio;

        // Tạo âm thanh beep
        function createBeep() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.type = 'square';
            oscillator.frequency.value = 1000;
            gainNode.gain.value = 0.5;
            oscillator.start();
            setTimeout(() => {
                oscillator.stop();
            }, 200);
        }

        // Khởi động camera sau
        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }, // Camera sau
                    audio: true // Để ghi âm nếu cần, nhưng có thể bỏ nếu chỉ video
                });
                video.srcObject = stream;
                video.play();
                requestAnimationFrame(scanQR);
            } catch (err) {
                status.textContent = 'Lỗi truy cập camera: ' + err.message;
            }
        }

        // Quét QR từ video
        function scanQR() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    currentQRCode = code.data;
                    if (!isRecording && currentQRCode !== lastQRCode) {
                        // Bắt đầu ghi
                        createBeep();
                        startRecording();
                        lastQRCode = currentQRCode;
                        status.textContent = 'Đang ghi video với mã: ' + currentQRCode;
                    } else if (isRecording && currentQRCode !== lastQRCode) {
                        // Dừng và lưu
                        stopRecording();
                        lastQRCode = currentQRCode;
                        status.textContent = 'Video đã lưu. Quét QR tiếp theo để bắt đầu.';
                    }
                }

                // Vẽ overlay nếu đang ghi
                if (isRecording) {
                    const now = new Date();
                    const dateTime = now.toLocaleString('vi-VN');
                    ctx.font = '20px Arial';
                    ctx.fillStyle = 'white';
                    ctx.fillText(dateTime + ' - Mã: ' + (lastQRCode || ''), 10, canvas.height - 10);
                    // Để overlay lên video, nhưng vì video là stream, chúng ta cần composite nếu muốn ghi overlay vào video
                    // Ở đây, overlay chỉ hiển thị trên canvas tạm thời, để ghi vào video cần xử lý trong MediaRecorder
                }
            }
            requestAnimationFrame(scanQR);
        }

        // Bắt đầu ghi video
        function startRecording() {
            recordedChunks = [];
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    recordedChunks.push(event.data);
                }
            };
            mediaRecorder.onstop = saveVideo;
            mediaRecorder.start();
            isRecording = true;
        }

        // Dừng ghi
        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
        }

        // Lưu video
        function saveVideo() {
            const blob = new Blob(recordedChunks, { type: 'video/webm' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = 'video_' + new Date().toISOString() + '.webm';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }

        // Khởi động
        startCamera();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>QR Camera Secure</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
  text-align: center;
  padding: 10px;
}
input, button {
  padding: 10px;
  font-size: 16px;
  margin: 5px;
}
video {
  width: 100%;
  max-width: 420px;
  margin-top: 10px;
  border: 2px solid #0f0;
}
#log {
  margin-top: 10px;
  font-size: 14px;
  word-break: break-word;
}
</style>
</head>

<body>

<h3>🔐 Nhập mật khẩu</h3>
<input id="passwordInput" placeholder="Nhập mật khẩu">
<button onclick="login()">Xác nhận</button>

<div id="cameraBox" style="display:none;">
  <video id="video" autoplay playsinline muted></video>
  <p id="log">Chưa quét QR</p>
</div>

<script src="https://unpkg.com/jsqr/dist/jsQR.js"></script>

<script>
/* =============================
   1️⃣ MẬT KHẨU (TỰ ĐỔI)
============================= */
const USERS = {
  "pass001": null,
  "pass002": null,
  "pass003": null,
  "pass004": null,
  "pass005": null
};

/* =============================
   2️⃣ KHÓA THIẾT BỊ
============================= */
function getDeviceId() {
  let id = localStorage.getItem("device_id");
  if (!id) {
    id = crypto.randomUUID();
    localStorage.setItem("device_id", id);
  }
  return id;
}

/* =============================
   3️⃣ ÂM THANH BÍP (CHẮC CHẮN KÊU)
============================= */
let audioCtx;
function beep() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = "square";
  osc.frequency.value = 1000;
  gain.gain.value = 0.2;

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  setTimeout(() => osc.stop(), 150);
}

/* =============================
   4️⃣ ĐĂNG NHẬP + KHÓA
============================= */
async function login() {
  const pass = passwordInput.value.trim();
  const deviceId = getDeviceId();

  if (!(pass in USERS)) {
    alert("❌ Sai mật khẩu");
    return;
  }

  const key = "lock_" + pass;
  const locked = localStorage.getItem(key);

  if (!locked) {
    localStorage.setItem(key, deviceId);
  } else if (locked !== deviceId) {
    alert("⛔ Mật khẩu đã dùng trên thiết bị khác");
    return;
  }

  cameraBox.style.display = "block";

  // BẮT BUỘC mở AudioContext bằng user click
  beep();

  await startCamera();
}

/* =============================
   5️⃣ CAMERA SAU + ÂM THANH
============================= */
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { exact: "environment" } },
    audio: true
  });

  video.muted = false; // MỞ ÂM THANH
  video.srcObject = stream;

  scanQR();
}

/* =============================
   6️⃣ QUÉT QR + BÍP
============================= */
function scanQR() {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  let lastQR = "";

  setInterval(() => {
    if (video.readyState !== video.HAVE_ENOUGH_DATA) return;

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);

    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const qr = jsQR(img.data, canvas.width, canvas.height);

    if (qr && qr.data !== lastQR) {
      lastQR = qr.data;
      document.getElementById("log").innerText = "📦 QR: " + qr.data;
      beep();
    }
  }, 400);
}
</script>

</body>
</html>

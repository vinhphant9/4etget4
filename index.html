<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quét mã đơn</title>

<style>

body{
margin:0;
padding:0;
background:#000;
color:white;
font-family:Arial;
text-align:center;
}

#reader{
width:100%;
max-width:500px;
margin:auto;
}

#status{
margin:10px;
font-size:18px;
}

#qr-list-container{
width:100%;
max-width:500px;
margin:20px auto;
}

ul{
list-style:none;
padding:0;
}

li{
margin:8px;
padding:10px;
border:1px solid #555;
background:#333;
}

#complete{
padding:12px 25px;
margin:10px;
background:#4CAF50;
color:white;
border:none;
cursor:pointer;
font-size:16px;
}

</style>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>

<body>

<h2>Quét mã đơn</h2>

<div id="reader"></div>

<div id="status">Đang chờ quét QR...</div>

<div id="qr-list-container">

<h3>Danh sách</h3>

<ul id="qr-list"></ul>

<button id="complete">Hoàn thành</button>

</div>

<script>

const status = document.getElementById('status');
const qrList = document.getElementById('qr-list');
const completeButton = document.getElementById('complete');

let html5QrCode;

let scannedCodes = [];
let scannedSet = new Set();

let audioCtx = new (window.AudioContext || window.webkitAudioContext)();

async function createBeep() {

if (audioCtx.state === 'suspended') {
await audioCtx.resume();
}

const oscillator = audioCtx.createOscillator();
const gainNode = audioCtx.createGain();

oscillator.connect(gainNode);
gainNode.connect(audioCtx.destination);

oscillator.type = 'square';
oscillator.frequency.value = 1000;
gainNode.gain.value = 0.5;

oscillator.start();

setTimeout(() => {
oscillator.stop();
}, 200);

}

async function startScanner(){

html5QrCode = new Html5Qrcode("reader");

const config = { fps: 10, qrbox: { width: 250, height: 250 } };

await html5QrCode.start(
{ facingMode: "environment" },
config,
onScanSuccess
);

}

function onScanSuccess(decodedText){

if (scannedSet.has(decodedText)) return;

scannedSet.add(decodedText);

createBeep();

addToList(decodedText);

}

function addToList(code){

const now = new Date();

const stt = scannedCodes.length + 1;

const item = {
stt: stt,
time: now.toLocaleString('vi-VN'),
code: code
};

scannedCodes.push(item);

const li = document.createElement('li');

li.textContent = `${item.stt} | ${item.time} | ${item.code}`;

qrList.appendChild(li);

}

completeButton.addEventListener('click', () => {

if (scannedCodes.length === 0) {
alert('Chưa có mã nào!');
return;
}

if (html5QrCode) {
html5QrCode.stop().catch(err => console.error(err));
}

const ws = XLSX.utils.json_to_sheet(scannedCodes.map(item => ({

'Số thứ tự': item.stt,
'Ngày giờ': item.time,
'Mã đơn': item.code

})));

const wb = XLSX.utils.book_new();

XLSX.utils.book_append_sheet(wb, ws, 'Danh sách');

XLSX.writeFile(wb, 'danh_sach_ma_qr.xlsx');

alert('File đã tải xuống!');

});

document.addEventListener('touchend', () => {

if (audioCtx.state === 'suspended') {
audioCtx.resume();
}

}, { once: true });

startScanner();

</script>

</body>
</html>

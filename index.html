<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tính lợi nhuận TikTok Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    font-family: Arial;
    background: #f4f6f8;
    padding: 20px;
}
.box {
    max-width: 420px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 12px;
}
input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    font-size: 16px;
}
button {
    width: 100%;
    padding: 12px;
    background: #27ae60;
    color: #fff;
    border: none;
    font-size: 16px;
    border-radius: 6px;
}
.result {
    margin-top: 15px;
    line-height: 1.6;
}
</style>
</head>

<body>
<div class="box">
    <h3>📦 TÍNH LỢI NHUẬN TIKTOK SHOP</h3>

    <label>Giá nhập (đ)</label>
    <input type="number" id="giaNhap" placeholder="Ví dụ: 10000">

    <label>Khách thanh toán (đ)</label>
    <input type="number" id="giaBan" placeholder="Ví dụ: 57080">

    <button onclick="tinh()">Tính toán</button>

    <div class="result" id="kq"></div>
</div>

<script>
function tinh() {
    let giaNhap = Number(giaNhap.value);
    let giaBan = Number(giaBan.value);

    if (giaNhap <= 0 || giaBan <= 0) {
        kq.innerHTML = "⚠️ Nhập số hợp lệ";
        return;
    }

    // % phí trích từ ảnh
    let phiGiaoDich = giaBan * 0.04;
    let phiHoaHong = giaBan * 0.0884;
    let hoaHongLienKet = giaBan * 0.0588;
    let thue = giaBan * 0.011;

    let phiCoDinh = 3000 + 1620;

    let tongPhi = phiGiaoDich + phiHoaHong + hoaHongLienKet + thue + phiCoDinh;

    let tienQuyetToan = giaBan - tongPhi;
    let loiNhuan = tienQuyetToan - giaNhap;

    kq.innerHTML = `
    <b>Tổng phí:</b> ${tongPhi.toLocaleString()} đ<br>
    <b>Tiền quyết toán:</b> ${tienQuyetToan.toLocaleString()} đ<br>
    <hr>
    <b>Giá nhập:</b> ${giaNhap.toLocaleString()} đ<br>
    <b style="color:${loiNhuan>=0?'green':'red'}">
        Lợi nhuận: ${loiNhuan.toLocaleString()} đ
    </b>
    `;
}
</script>
</body>
</html>

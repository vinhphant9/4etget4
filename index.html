<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tính lợi nhuận</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        padding: 20px;
    }
    .box {
        max-width: 400px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h2 {
        text-align: center;
    }
    input {
        width: 100%;
        padding: 10px;
        margin-top: 10px;
        font-size: 16px;
    }
    button {
        width: 100%;
        padding: 12px;
        margin-top: 15px;
        background: #2ecc71;
        border: none;
        color: #fff;
        font-size: 16px;
        border-radius: 5px;
    }
    .result {
        margin-top: 15px;
        font-size: 16px;
    }
</style>
</head>
<body>

<div class="box">
    <h2>TÍNH LỢI NHUẬN</h2>

    <label>Giá nhập (đ)</label>
    <input type="number" id="giaNhap" placeholder="Ví dụ: 10000">

    <label>Giá bán (đ)</label>
    <input type="number" id="giaBan" placeholder="Ví dụ: 40000">

    <button onclick="tinhLoiNhuan()">Tính</button>

    <div class="result" id="ketQua"></div>
</div>

<script>
function tinhLoiNhuan() {
    let giaNhap = Number(document.getElementById("giaNhap").value);
    let giaBan = Number(document.getElementById("giaBan").value);

    if (giaNhap <= 0 || giaBan <= 0) {
        document.getElementById("ketQua").innerHTML = "⚠️ Nhập số hợp lệ";
        return;
    }

    let loiNhuan = giaBan - giaNhap;
    let phanTram = (loiNhuan / giaNhap) * 100;

    document.getElementById("ketQua").innerHTML = `
        <b>Lợi nhuận:</b> ${loiNhuan.toLocaleString()} đ<br>
        <b>Tỷ suất lãi:</b> ${phanTram.toFixed(2)} %
    `;
}
</script>

</body>
</html>
